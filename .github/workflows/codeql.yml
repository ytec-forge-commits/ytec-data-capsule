name: CodeQL security analysis

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    if: github.event.repository.private == false
    runs-on: windows-2022
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        run: dotnet restore .\Ytec.WindowsBackup.slnx

      - name: Build
        run: >-
          dotnet build .\Ytec.WindowsBackup.slnx
          -t:Rebuild
          -c Release
          --no-restore
          -p:PlatformTarget=AnyCPU
          -p:Prefer32Bit=false

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          category: /language:csharp
